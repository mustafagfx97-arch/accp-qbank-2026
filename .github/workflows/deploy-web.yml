name: Deploy ACCP QBank web

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'tools/build_web_data.py'
      - 'app/src/main/assets/questions.json.gz'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web-safe question data
        run: python tools/build_web_data.py app/src/main/assets/questions.json.gz web/data/questions.json.gz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

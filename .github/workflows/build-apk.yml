name: Build ACCP Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build verified debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: accp-qbank-2026-debug-keystore-v1

      - name: Create debug signing key when absent
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=ACCP QBank 2026,C=IQ" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Test and build APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify packaged question bank
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/questions.json > /tmp/questions.json
          echo "d285391e4ec2debe39a1ca6be969cf265c53d41c0cdf70003fb3631fa35cfb75  /tmp/questions.json" | sha256sum --check

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACCP-QBank-2026-v1.1-Case-Sequencing
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
